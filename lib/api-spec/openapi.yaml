openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: CommercePulse analytics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: orders
  - name: products
  - name: customers
  - name: marketing
  - name: integrations
  - name: settings
  - name: activities
  - name: insights
  - name: notifications
  - name: onboarding
  - name: admin
  - name: account
  - name: traffic
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account and seed demo data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: me
      tags: [auth]
      summary: Get the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/export:
    get:
      operationId: exportAccountData
      tags: [account]
      summary: Download the current account data export
      security:
        - bearerAuth: []
      responses:
        "200":
          description: JSON account export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthenticated

  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the current account and its data
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted
        "401":
          description: Unauthenticated

  /traffic/events:
    post:
      operationId: createTrafficEvent
      tags: [traffic]
      summary: Record a first-party traffic event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrafficEventBody"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficEventResponse"
        "400":
          description: Invalid event
    get:
      operationId: listTrafficEvents
      tags: [traffic]
      summary: List first-party traffic events
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Traffic events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/TrafficEvent" }

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: KPI overview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Overview KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"

  /dashboard/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [dashboard]
      summary: Revenue & ad spend by day
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Daily revenue & spend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenuePoint"

  /dashboard/revenue-by-platform:
    get:
      operationId: getRevenueByPlatform
      tags: [dashboard]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Revenue by platform
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformRevenue"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: platform
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/fulfill:
    post:
      operationId: fulfillOrder
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/send-receipt:
    post:
      operationId: sendOrderReceipt
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Receipt send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendReceiptResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Products with performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductPerformance"
    post:
      operationId: createProduct
      tags: [products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPerformance"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPerformance"
    delete:
      operationId: deleteProduct
      tags: [products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /shipping-rates:
    get:
      operationId: listShippingRates
      tags: [shippingRates]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Shipping rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingRate"
    post:
      operationId: createShippingRate
      tags: [shippingRates]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShippingRateBody"
      responses:
        "201":
          description: Shipping rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingRate"

  /shipping-rates/{id}:
    patch:
      operationId: updateShippingRate
      tags: [shippingRates]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShippingRateBody"
      responses:
        "200":
          description: Shipping rate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingRate"
    delete:
      operationId: deleteShippingRate
      tags: [shippingRates]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

  /marketing/summary:
    get:
      operationId: getMarketingSummary
      tags: [marketing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingSummary"

  /marketing/trend:
    get:
      operationId: getMarketingTrend
      tags: [marketing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Daily paid acquisition spend and attributed revenue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketingTrendPoint"

  /marketing/campaigns:
    get:
      operationId: listCampaigns
      tags: [marketing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"

  /marketing/by-channel:
    get:
      operationId: getMarketingByChannel
      tags: [marketing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Spend & revenue per channel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelMetric"

  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"

  /integrations/{platform}/connect:
    post:
      operationId: connectIntegration
      tags: [integrations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: platform
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectIntegrationBody"
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /integrations/{integrationId}/disconnect:
    post:
      operationId: disconnectIntegration
      tags: [integrations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: integrationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"

  /integrations/{integrationId}/sync:
    post:
      operationId: syncIntegration
      tags: [integrations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: integrationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"

  /integrations/health:
    get:
      operationId: getIntegrationsHealth
      tags: [integrations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsHealth"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /settings/exchange-rates:
    get:
      operationId: getExchangeRates
      tags: [settings]
      summary: Live exchange rates base USD (cached 1 h)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Exchange rate map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRates"

  /insights:
    get:
      operationId: getInsights
      tags: [insights]
      summary: AI-powered business insights and recommendations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Insights list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"

  /insights/summary:
    get:
      operationId: getInsightsSummary
      tags: [insights]
      summary: Customer, store, and traffic insights
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RangeParam"
      responses:
        "200":
          description: Live customer, store, and traffic insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsSummary"

  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List user notifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Reset requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      tags: [onboarding]
      summary: Check onboarding status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Complete onboarding
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "403":
          description: Forbidden

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsResponse"
        "403":
          description: Forbidden

  /admin/audit-log:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: List audit logs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogResponse"
        "403":
          description: Forbidden

  /events/subscribe:
    get:
      operationId: subscribeEvents
      tags: [events]
      summary: SSE stream for real-time updates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RangeParam:
      in: query
      name: range
      schema:
        type: string
        enum: [7d, 14d, 30d, 90d]
        default: 30d

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    ExchangeRates:
      type: object
      required: [base, rates]
      properties:
        base: { type: string }
        rates:
          type: object
          additionalProperties: { type: number }

    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        isDemo: { type: boolean }

    AuthResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string }
        expiresAt: { type: string }
        user: { $ref: "#/components/schemas/AuthUser" }

    TrafficEventBody:
      type: object
      required: [eventName]
      properties:
        eventName: { type: string, minLength: 1, maxLength: 80 }
        sessionId: { type: string, maxLength: 160 }
        pagePath: { type: string, maxLength: 500 }
        source: { type: string, maxLength: 120 }
        medium: { type: string, maxLength: 120 }
        campaign: { type: string, maxLength: 160 }
        value: { type: number }
        occurredAt: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true

    TrafficEventResponse:
      type: object
      required: [id, eventName, occurredAt]
      properties:
        id: { type: string }
        eventName: { type: string }
        occurredAt: { type: string, format: date-time }

    TrafficEvent:
      type: object
      required: [id, eventName, occurredAt]
      properties:
        id: { type: string }
        eventName: { type: string }
        sessionId: { type: string, nullable: true }
        pagePath: { type: string, nullable: true }
        source: { type: string, nullable: true }
        medium: { type: string, nullable: true }
        campaign: { type: string, nullable: true }
        value: { type: number, nullable: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
        occurredAt: { type: string, format: date-time }

    RegisterBody:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string }
        password: { type: string }
        name: { type: string }

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    Metric:
      type: object
      required: [value, deltaPct]
      properties:
        value: { type: number }
        deltaPct: { type: number }

    DashboardOverview:
      type: object
      required:
        [
          range,
          revenue,
          adSpend,
          profit,
          ordersCount,
          avgOrderValue,
          roas,
          cpa,
          margin,
        ]
      properties:
        range: { type: string }
        revenue: { $ref: "#/components/schemas/Metric" }
